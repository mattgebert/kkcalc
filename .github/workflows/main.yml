# This workflow is the master workflow that runs all other workflows in the correct order, particularly for generating releases.
#
name: Master 👑 Workflow
run-name: ${{ github.actor }} - Master 👑 Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

on:
  push:
    # Run on all branches
  pull_request:
  workflow_dispatch:
    inputs:
      gui:
        description: 'Generate GUI Executable?'
        required: true
        default: true
        type: boolean

jobs:
  branch_check:
    # Check if we are on the 'main' branch or release branches:
    name: Branch Check 🔍
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.check.outputs.is_main }}
    steps:
      - id: check
      # Check if the branch is 'main' or starts with 'releases/', and set and report the output accordingly
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" || "${GITHUB_REF##*/}" == releases/* ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Branch is_main: "


  linting:
    name: Linting 📜 (NumpyDoc, Ruff & Black)
    uses: ./.github/workflows/linting.yml

  testing:
    name: Tests 🔧 (PyTest, Coveralls)
    uses: ./.github/workflows/tests.yml

  docs:
    name: Documentation 🔎 (Sphinx and PyData)
    uses: ./.github/workflows/docs.yml

  # TODO: Can add other OS builds here as needed...
  pyinstaller-build:
    if: ${{ (github.event == 'workflow_dispatch' && inputs.gui == 'true') || (github.event == 'push' && needs.branch_check.outputs.is_main == 'true') }}
    name: kkcalc GUI 💻 (PyInstaller Executable Build)
    uses: ./.github/workflows/pyinst.yml
    needs: [testing, branch_check]
    with:
      os: 'Windows'

  # Add write permissions to allow semantic-versioning to create tags/releases
  semantic-versioning-and-build:
    name: Python 🐍 Semantic Versioning
    uses: ./.github/workflows/semver.yml
    needs: [linting, testing, docs, pyinstaller-build, branch_check]
    # If pyinstaller-build is skipped, stil run:
    if: ${{ always() && needs.linting.result == 'success' && needs.testing.result == 'success' && needs.docs.result == 'success' }}
    permissions:
      contents: write
      id-token: write
    with:
      # Build a GUI when pushed to the 'main' branch, or when manually triggered with GUI option enabled.
      gui: ${{ ((github.event == 'workflow_dispatch') && inputs.gui) || (github.event == 'push' && needs.branch_check.outputs.is_main == 'true') }}
