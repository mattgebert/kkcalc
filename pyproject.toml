## What system to build the project with? I.e. Setuptools, Wheel, Poetry, etc.
## Using `setuptools` here.

[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0" # includes git datafiles to be included in the package.
]
build-backend = "setuptools.build_meta"

[project]
# Project information
name = "KKCalc"
version = "0.8.0"
description = "Kramers-Kronig transforms for optical data, via API or GUI interfaces."
readme = "README.md"
# license = {file = "LICENSE.txt"}
license = {text = "MIT License"}
keywords = ["Kramers-Kronig", "Optical Data", "X-ray", "Spectroscopy", "Transform", "Contrast"]

# Project compatibility:
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]
classifiers = [
    "Developement Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

# Author information
authors = [
    {name = "Benjamin Watts", email = "benjamin.watts@gmail.com"},
    {name = "Matthew Gebert", email = "mattheuu.gebert@gmail.com"}
]

[project.urls]
# Website, documentation and other continuous integration URLS.
code = "https://github.com/benajamin/kkcalc"
documentation = "https://kkcalc.readthedocs.io/en/latest/"


[project.optional-dependencies]
gui = [
    "pyqt6",
    "matplotlib",
    "pandas",
]
dev = [
    "pre-commit",
    "numpydoc",
    "sphinx",
    "sphinx-rtd-theme",
    "pytest",
    "python-semantic-release",
    "commitizen",
    "periodictable",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
]

# ------------------- NUMPYDOC -------------------
[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
]
# remember to use single quotes for regex in TOML
exclude = [  # don't report on objects that match any of these regex
    '\.undocumented_method$',
    '\.__repr__$',
    # Add the .py modules here. Packages don't seem to work...
    'test_stoich',

]
override_SS05 = [  # override SS05 to allow docstrings starting with these words
    '^Process ',
    '^Assess ',
    '^Access ',
]

[tool.commitizen]
update_changelog_on_bump = true
tag_format = "v$major.$minor.$patch$prerelease.$devrelease"

# ---------- Semantic Release for versioning ------------
[tool.semantic_release]
version_variables = ["pyproject.toml:project:version"]

